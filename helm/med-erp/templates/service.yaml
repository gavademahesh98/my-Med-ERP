---
# User Service — ClusterIP (internal only, accessed through Ingress)
apiVersion: v1
kind: Service
metadata:
  name: user-service
  labels:
    app: user-service
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - name: http
      port: {{ .Values.serviceUser.port }}
      targetPort: {{ .Values.serviceUser.targetPort }}
      protocol: TCP

---
# Product Service — ClusterIP
apiVersion: v1
kind: Service
metadata:
  name: product-service  
  labels:
    app: product-service
spec:
  type: ClusterIP
  selector:
    app: product-service
  ports:
    - name: http
      port: {{ .Values.serviceProduct.port }}
      targetPort: {{ .Values.serviceProduct.targetPort }}
      protocol: TCP

---
# Order Service — ClusterIP
apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      port: {{ .Values.serviceOrder.port }}
      targetPort: {{ .Values.serviceOrder.targetPort }}
      protocol: TCP
