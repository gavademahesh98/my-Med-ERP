replicas: 2
image:
  repository: "655887417250.dkr.ecr.ap-southeast-1.amazonaws.com/dev-user-service"   # It will update via deployment steps
  tag: "8"         # It will update via deployment steps
  pullPolicy: Always
port:
  containerPort: 8081

service:
  type: ClusterIP
  port: 8081
  targetPort: 8081

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"

hpa:
  minReplicas: 2
  maxReplicas: 6

  cpu:
    averageUtilization: 70
  
  memory:
    averageUtilization: 80


