apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalsecret.secretName }}
  
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  target:
    name: app-secrets                   # external secret will create or update this kubernetes secrets called app-secrets  late this is used inside deployment
    creationPolicy: Owner

  dataFrom:
    - extract:                          # it will extract all key  inside secrets
        key: {{ .Values.externalsecret.awsSecretName }}       #this is name of secret inside AWS secret manager